[project]
name = "llm-zoomcamp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gitsource>=0.0.5",
    "minsearch>=0.1.0",
    "openai>=2.41.1",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "sentence-transformers>=5.6.0",
    "sqlitesearch>=0.1.0",
    "toyaikit>=0.0.11",
    "truststore>=0.10.4",
]

# This repo is a collection of runnable course scripts, not an installable
# package, so tell uv not to try building/installing the project itself.
# The project root is put on sys.path via a .pth file in the venv instead.
[tool.uv]
package = false
